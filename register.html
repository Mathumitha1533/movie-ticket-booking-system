<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Movie Ticket Booking System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/i18n.css">
  <link rel="stylesheet" href="../css/polish.css">
</head>
<body>
  <header class="header">
    <div class="logo">🎬 MovieTix</div>
    <nav class="nav">
      <a href="../index.html" data-i18n="common.home">Home</a>
      <a href="movies.html" data-i18n="common.movies">Movies</a>
      <a href="login.html" id="loginLink" data-i18n="common.login">Login</a>
      <a href="register.html" id="registerLink" data-i18n="common.register">Register</a>
      <a href="#" id="logoutLink" style="display:none;" data-i18n="common.logout">Logout</a>
      <span id="userGreeting" class="user-greeting"></span>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2 data-i18n="auth.registerTitle">Create Account</h2>
      <p class="auth-subtitle" data-i18n="auth.registerSubtitle">Register to start booking tickets</p>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="fullname" data-i18n="auth.fullName">Full Name</label>
          <input type="text" id="fullname" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
          <label for="email" data-i18n="auth.email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="phone" data-i18n="auth.phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="10-digit mobile number" required>
        </div>
        <div class="form-group">
          <label for="password" data-i18n="auth.password">Password</label>
          <input type="password" id="password" placeholder="Create a password" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword" data-i18n="auth.confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter password" required>
        </div>
        <button type="submit" class="btn-primary btn-block" data-i18n="auth.registerBtn">Register</button>
        <p id="registerMessage" class="form-message"></p>
      </form>

      <p class="auth-footer-text">
        <span data-i18n="auth.haveAccount">Already have an account?</span> 
        <a href="login.html" data-i18n="auth.loginHere">Login here</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p data-i18n="home.footer">&copy; 2026 Movie Ticket Booking System. All rights reserved.</p>
  </footer>

  <script src="../js/i18n.js"></script>
  <script src="../js/header.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/polish.js"></script>
</body>
</html>
