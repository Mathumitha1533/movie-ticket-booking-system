<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Movie Ticket Booking System</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/i18n.css">
  <link rel="stylesheet" href="../css/polish.css">
</head>
<body>
  <header class="header">
    <div class="logo">🎬 MovieTix <span class="admin-tag">ADMIN</span></div>
    <nav class="nav">
      <a href="../index.html" data-i18n="common.home">Home</a>
      <a href="movies.html" data-i18n="common.movies">Movies</a>
      <a href="login.html">Customer Login</a>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <h2>Admin Login</h2>
      <p class="auth-subtitle">Restricted access — authorized personnel only</p>

      <form id="adminLoginForm" class="auth-form">
        <div class="form-group">
          <label for="adminEmail">Admin Email</label>
          <input type="email" id="adminEmail" placeholder="admin@movietix.com" required>
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" placeholder="Enter admin password" required>
        </div>
        <button type="submit" class="btn-primary btn-block">Login as Admin</button>
        <p id="adminLoginMessage" class="form-message"></p>
      </form>

      <div class="demo-credentials">
        <p><strong>Demo Credentials:</strong></p>
        <p>📧 admin@movietix.com</p>
        <p>🔑 admin123</p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Movie Ticket Booking System. All rights reserved.</p>
  </footer>

  <script src="../js/admin-login.js"></script>
  <script src="../js/polish.js"></script>
</body>
</html>
